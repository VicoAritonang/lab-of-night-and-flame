[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "arl-lab"
version = "0.3.0"
description = "Python SDK for Agent Reliability Lab: live agent traces, state snapshots and Workbench replays."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["websockets>=13"]
keywords = ["ai-agents", "llm", "observability", "evaluation", "tracing", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/VicoAritonang/lab-of-night-and-flame"
Source = "https://github.com/VicoAritonang/lab-of-night-and-flame/tree/main/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["src/arl_lab"]
