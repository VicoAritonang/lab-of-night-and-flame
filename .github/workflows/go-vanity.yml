name: go.vicoworks.com

# Deploys the Cloudflare Worker that serves Go vanity import paths.
# Secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers" + Zone:DNS:Edit
# on vicoworks.com) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["deploy/go-vanity/**", ".github/workflows/go-vanity.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-vanity
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare
    defaults:
      run:
        working-directory: deploy/go-vanity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: deploy/go-vanity
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://go.vicoworks.com/arl?go-get=1" | grep -q 'go.vicoworks.com/arl git https://github.com/VicoAritonang/lab-of-night-and-flame sdk/go'; then exit 0; fi
            sleep 10
          done
          echo "go-import meta not served yet" >&2; exit 1
