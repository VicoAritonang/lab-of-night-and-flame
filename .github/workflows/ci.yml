name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arl_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ARL_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/arl_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply schema
        run: psql "$ARL_TEST_DB_URL" -v ON_ERROR_STOP=1 -q -f sql/init.sql
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - name: Slim build (every exclusion tag)
        run: |
          go vet -tags arl_nosqs,arl_nootel,arl_noui ./...
          go test -tags arl_nosqs,arl_nootel,arl_noui -count=1 ./internal/features ./internal/config
          go test -tags arl_nosqs,arl_nootel,arl_noui -count=1 -run TestDisabledModules ./internal/server
      - run: go test -p 1 -count=1 ./...
      - name: Race detector
        run: go test -race -p 1 -count=1 ./internal/... ./sdk/...

  sdk-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./... && go test -race -count=1 ./...
      # Build a separate module that imports the SDK by its published path,
      # exactly as users do (resolved locally instead of through the vanity host).
      - name: Consumer import
        run: |
          grep -qx 'module go.vicoworks.com/agent-reliability-lab/sdk/go' go.mod
          grep -qx 'module go.vicoworks.com/agent-reliability-lab' ../../go.mod
          mkdir -p /tmp/consumer && cd /tmp/consumer
          go mod init example.com/consumer
          go mod edit -require=go.vicoworks.com/agent-reliability-lab/sdk/go@v0.0.0 -replace=go.vicoworks.com/agent-reliability-lab/sdk/go=$GITHUB_WORKSPACE/sdk/go
          cat > main.go <<'GO'
          package main

          import arl "go.vicoworks.com/agent-reliability-lab/sdk/go"

          func main() { _ = arl.New("ci", arl.Options{}).Enabled() }
          GO
          go mod tidy && go build ./...

  sdk-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q

  sdk-typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [server, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
