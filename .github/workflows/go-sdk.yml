name: Go SDK publish

# Publishes go.vicoworks.com/agent-reliability-lab/sdk/go (nested module in
# sdk/go) without a full release:
#   - push a tag sdk/go/vX.Y.Z yourself, or
#   - run this workflow manually for an existing sdk/go/vX.Y.Z tag, e.g. after
#     registering the module in the vanity worker.
# Full releases (tag vX.Y.Z) create the sdk/go tag in release.yml instead.
on:
  push:
    tags: ["sdk/go/v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (vX.Y.Z); the tag sdk/go/vX.Y.Z must exist"
        required: true

permissions:
  contents: read

concurrency:
  group: go-sdk-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then v="${GITHUB_REF_NAME#sdk/go/}"; else v="$INPUT_VERSION"; fi
          [[ "$v" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid version '$v'"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The publish script comes from the workflow's ref; the SDK is tested at the tag.
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/sdk/go/${{ steps.v.outputs.version }}
          path: tagged
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test the tagged SDK
        working-directory: tagged/sdk/go
        run: go vet ./... && go test -count=1 ./...
      - name: Verify vanity path, publish to proxy.golang.org and pkg.go.dev
        working-directory: tagged
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-sdk-publish.sh" "${{ steps.v.outputs.version }}"
