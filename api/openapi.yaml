  # ------------------------------------------------------------------ prompts
  /prompts:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: listPrompts
      tags: [prompts]
      summary: List prompts, recently updated first
      x-stability-level: stable
      responses:
        "200":
          description: Prompts.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Prompt"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: commitPrompt
      tags: [prompts]
      summary: Commit a prompt version, creating the prompt when needed
      description: Committing a template and config identical to the latest version without labels returns that version with `created` false.
      x-stability-level: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/PromptCommit"
                - type: object
                  required: [name]
                  properties:
                    name: {type: string}
                    description: {type: string}
      responses:
        "200":
          description: The committed version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptCommitted"}
        default: {$ref: "#/components/responses/Problem"}
  /prompts/{name}:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Name"
    get:
      operationId: getPrompt
      tags: [prompts]
      summary: Resolve a prompt version by label, version or latest
      x-stability-level: stable
      parameters:
        - {name: label, in: query, schema: {type: string}}
        - {name: version, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: The resolved version with the prompt labels.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptResolved"}
        default: {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deletePrompt
      tags: [prompts]
      summary: Delete a prompt and its versions
      x-stability-level: stable
      responses:
        "200": {$ref: "#/components/responses/Deleted"}
        default: {$ref: "#/components/responses/Problem"}
  /prompts/{name}/versions:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Name"
    get:
      operationId: listPromptVersions
      tags: [prompts]
      summary: List versions, newest first
      x-stability-level: stable
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/PromptVersion"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: commitPromptVersion
      tags: [prompts]
      summary: Commit a version of an existing prompt
      x-stability-level: stable
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PromptCommit"}
      responses:
        "200":
          description: The committed version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptCommitted"}
        default: {$ref: "#/components/responses/Problem"}
  /prompts/{name}/labels:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Name"
    post:
      operationId: setPromptLabel
      tags: [prompts]
      summary: Point a label at a version
      x-stability-level: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, version]
              properties:
                label: {type: string, pattern: "^[a-z][a-z0-9_-]{0,39}$"}
                version: {type: integer, minimum: 1}
      responses:
        "200":
          description: The prompt with its labels.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Prompt"}
        default: {$ref: "#/components/responses/Problem"}
  /prompts/{name}/render:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Name"
    post:
      operationId: renderPrompt
      tags: [prompts]
      summary: Fill a version template with variables
      x-stability-level: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: {type: string}
                version: {type: integer}
                variables: {type: object, additionalProperties: true}
      responses:
        "200":
          description: Messages ready to send to a model.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PromptRendered"}
        default: {$ref: "#/components/responses/Problem"}

