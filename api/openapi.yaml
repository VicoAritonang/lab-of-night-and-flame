openapi: 3.1.0
info:
  title: Agent Reliability Lab API
  version: 1.0.0
  summary: Capture, replay and evaluate AI agents from any programming language.
  description: |
    REST contract of Agent Reliability Lab, version 1. The same lab also serves
    the typed gRPC/Connect API `arl.v1` (api/proto/arl/v1) and the arl/1 agent
    protocol over WebSocket (api/asyncapi.yaml).

    **Versioning.** Paths below are relative to `/api/v1`. Within v1 the lab
    only makes additive changes to operations marked `x-stability-level: stable`:
    new operations, new optional parameters, new response fields and new
    error codes. Clients must ignore unknown fields. Operations marked `beta`
    may still change between minor releases; changes are announced in the
    release notes. Removing or renaming anything stable requires `/api/v2`.
    The unversioned `/api` prefix is an alias of the newest major version,
    kept for the bundled UI.

    **Projects.** One lab owner can keep data in several projects. Select one
    with the `X-Lab-Project` header (default `default`).

    **Errors** are RFC 9457 problem documents (`application/problem+json`)
    with a stable machine-readable `code`; see the `Problem` schema.

    **Durable jobs.** Long operations run on the lab's job queue. They answer
    with the job ID in `X-Lab-Job-ID`; when the result is not ready within
    the server's wait budget the answer is `503` with code `job_pending`.
    Retry with the same `Idempotency-Key`, or poll `GET /jobs/{id}`.

    **Optional modules.** Operations owned by a module that the deployment
    disabled (ARL_FEATURES) answer `404` with code `feature_disabled`; the
    module of each tag is given as `x-arl-feature`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Vico Winner Sebastian Aritonang
    url: https://github.com/VicoAritonang/lab-of-night-and-flame
externalDocs:
  description: arl/1 integration guide
  url: https://github.com/VicoAritonang/lab-of-night-and-flame/blob/main/connection.md
servers:
  - url: /api/v1
    description: The lab that serves this document
  - url: http://localhost:8000/api/v1
    description: Local lab started with docker compose
security:
  - bearer: []
  - cookie: []
tags:
  - name: system
    description: Health, modules, authentication, projects and durable jobs.
  - name: models
    description: Model providers, the model catalog and scorers.
  - name: traces
    description: Agent sessions, runs and events captured over arl/1, gRPC or OTLP.
    x-arl-feature: traces
  - name: otel
    description: OTLP/HTTP trace ingest (OpenTelemetry GenAI, OpenInference, OpenLLMetry).
    x-arl-feature: otel
  - name: quality
    description: Feedback, annotation queues, online evaluators and alerts.
    x-arl-feature: quality
  - name: monitor
    description: Aggregated metrics over traces.
    x-arl-feature: monitor
  - name: prompts
    description: Versioned prompt registry with movable labels.
    x-arl-feature: prompts
  - name: workbench
    description: Saved agent scenarios, replays and LLM steps.
    x-arl-feature: workbench
  - name: suites
    description: Workbench regression suites (arl suite in CI).
    x-arl-feature: suites
  - name: datasets
    description: Datasets, samples, predictions and media artifacts.
    x-arl-feature: datasets
  - name: experiments
    description: Experiments, campaigns, trials and reports.
    x-arl-feature: experiments
  - name: playground
    description: One-off model calls.
    x-arl-feature: playground
  - name: perf
    description: Load tests of model endpoints.
    x-arl-feature: perf

paths:
  # ------------------------------------------------------------------ system
  /health:
    get:
      operationId: getHealth
      tags: [system]
      summary: Check health
      description: Checks the database and reports version and enabled modules. No authentication.
      security: []
      x-stability-level: stable
      responses:
        "200":
          description: The lab is healthy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        default: {$ref: "#/components/responses/Problem"}
  /features:
    get:
      operationId: getFeatures
      tags: [system]
      summary: List modules
      x-stability-level: stable
      responses:
        "200":
          description: Every module with its build and runtime state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Features"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [system]
      summary: Report authentication state
      security: []
      x-stability-level: stable
      responses:
        "200":
          description: Whether a token is required and whether this request carries it.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthStatus"}
        default: {$ref: "#/components/responses/Problem"}
  /auth/login:
    post:
      operationId: login
      tags: [system]
      summary: Exchange the owner token for a session cookie
      security: []
      x-stability-level: stable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string, description: The value of ARL_AUTH_TOKEN.}
      responses:
        "200":
          description: Authenticated; an HttpOnly `arl_token` cookie is set when auth is enabled.
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: {type: boolean, const: true}
        default: {$ref: "#/components/responses/Problem"}
  /auth/logout:
    post:
      operationId: logout
      tags: [system]
      summary: Clear the session cookie
      security: []
      x-stability-level: stable
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        default: {$ref: "#/components/responses/Problem"}
  /projects:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: listProjects
      tags: [system]
      summary: List projects
      x-stability-level: stable
      responses:
        "200":
          description: All projects, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Project"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: createProject
      tags: [system]
      summary: Create a project
      description: Fails with `409 conflict` when the ID is taken.
      x-stability-level: stable
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProjectCreate"}
      responses:
        "200":
          description: The project was created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectCreate"}
        default: {$ref: "#/components/responses/Problem"}
  /jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getJob
      tags: [system]
      summary: Get a durable job
      x-stability-level: stable
      responses:
        "200":
          description: The job state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Job"}
        default: {$ref: "#/components/responses/Problem"}
  /audit:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: listAudit
      tags: [system]
      summary: List the audit log
      x-stability-level: beta
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        "200": {$ref: "#/components/responses/Json"}
        default: {$ref: "#/components/responses/Problem"}
  /overview:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: getOverview
      tags: [system]
      summary: Summarize the project for the dashboard
      x-stability-level: beta
      responses:
        "200": {$ref: "#/components/responses/Json"}
        default: {$ref: "#/components/responses/Problem"}
  /openapi.json:
    get:
      operationId: getOpenAPIJSON
      tags: [system]
      summary: This document as JSON
      security: []
      x-stability-level: stable
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/json:
              schema: {type: object}
  /openapi.yaml:
    get:
      operationId: getOpenAPIYAML
      tags: [system]
      summary: This document as YAML
      security: []
      x-stability-level: stable
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/yaml:
              schema: {type: string}
  /docs:
    get:
      operationId: getDocs
      tags: [system]
      summary: Human-readable API index
      security: []
      x-stability-level: stable
      responses:
        "200":
          description: HTML page linking every contract.
          content:
            text/html:
              schema: {type: string}

  # ------------------------------------------------------------------ models
  /providers:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: listProviders
      tags: [models]
      summary: List model providers and their status
      x-stability-level: beta
      responses:
        "200": {$ref: "#/components/responses/Json"}
        default: {$ref: "#/components/responses/Problem"}
  /connections:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      operationId: createConnection
      tags: [models]
      summary: Add an OpenAI-compatible provider
      x-stability-level: beta
      requestBody: {$ref: "#/components/requestBodies/Json"}
      responses:
        "200": {$ref: "#/components/responses/Ok"}
        default: {$ref: "#/components/responses/Problem"}
  /catalog:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: listModels
      tags: [models]
      summary: Search the model catalog
      x-stability-level: beta
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: provider, in: query, schema: {type: string}}
        - {name: modality, in: query, schema: {type: string}}
        - {name: free, in: query, schema: {type: boolean}}
        - {name: sort, in: query, schema: {type: string, enum: [name, price, context, newest]}}
        - {name: refresh, in: query, schema: {type: boolean}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200": {$ref: "#/components/responses/Json"}
        default: {$ref: "#/components/responses/Problem"}
  /scorers:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: listScorers
      tags: [models]
      summary: List built-in scorers
      x-stability-level: beta
      responses:
        "200": {$ref: "#/components/responses/Json"}
        default: {$ref: "#/components/responses/Problem"}

  # ------------------------------------------------------------------ traces
  /agent-lab/status:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: getListenerStatus
      tags: [traces]
      summary: Get the agent listener state
      x-stability-level: stable
      responses:
        "200":
          description: Listener state and connected agents.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ListenerStatus"}
        default: {$ref: "#/components/responses/Problem"}
  /agent-lab/listener/start:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      operationId: startListener
      tags: [traces]
      summary: Accept agent connections for the project
      x-stability-level: stable
      responses:
        "200":
          description: Listener state after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ListenerStatus"}
        default: {$ref: "#/components/responses/Problem"}
  /agent-lab/listener/stop:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      operationId: stopListener
      tags: [traces]
      summary: Stop accepting events and disconnect agents
      x-stability-level: stable
      responses:
        "200":
          description: Listener state after the change.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ListenerStatus"}
        default: {$ref: "#/components/responses/Problem"}
  /agent-lab/config:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      operationId: setListenerConfig
      tags: [traces]
      summary: Set default checks for captured runs
      x-stability-level: beta
      requestBody: {$ref: "#/components/requestBodies/Json"}
      responses:
        "200": {$ref: "#/components/responses/Json"}
        default: {$ref: "#/components/responses/Problem"}
  /agent-lab/connection.md:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: getConnectionGuide
      tags: [traces]
      summary: arl/1 integration guide
      x-stability-level: stable
      responses:
        "200":
          description: Markdown guide.
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: "#/components/responses/Problem"}
  /agent-lab/ticket:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      operationId: createWebSocketTicket
      tags: [traces]
      summary: Issue a single-use WebSocket ticket
      description: For browsers, which cannot set headers on WebSocket connections. Open `/api/v1/agent-lab/ws?ticket=...` within 30 seconds.
      x-stability-level: stable
      responses:
        "200":
          description: The ticket.
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_in]
                properties:
                  ticket: {type: string}
                  expires_in: {type: integer, description: Seconds.}
        default: {$ref: "#/components/responses/Problem"}
  /agent-lab/sessions:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: listSessions
      tags: [traces]
      summary: List agent sessions
      x-stability-level: stable
      responses:
        "200":
          description: The 200 most recently seen sessions.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Session"}
        default: {$ref: "#/components/responses/Problem"}
  /agent-lab/runs:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: listRuns
      tags: [traces]
      summary: List runs, newest first
      x-stability-level: stable
      parameters:
        - {name: service_name, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: verdict, in: query, schema: {type: string}}
        - {name: model, in: query, schema: {type: string}}
        - {name: tag, in: query, schema: {type: string}}
        - {name: thread_id, in: query, schema: {type: string}}
        - {name: user_id, in: query, schema: {type: string}}
        - {name: source, in: query, schema: {type: string}}
        - {name: q, in: query, description: Name substring, run_id or trace ID., schema: {type: string}}
        - {name: min_ms, in: query, schema: {type: number}}
        - {name: errors, in: query, description: Only runs with errors or status failed., schema: {type: boolean}}
        - {name: before, in: query, description: Cursor, only runs started before this Unix time., schema: {type: number}}
        - {name: hours, in: query, description: Only runs started in the last N hours., schema: {type: number}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        "200":
          description: Matching runs.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/RunSummary"}
        default: {$ref: "#/components/responses/Problem"}
  /agent-lab/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getRun
      tags: [traces]
      summary: Get a run with its summary
      x-stability-level: stable
      responses:
        "200":
          description: The run.
          headers:
            X-Lab-Job-ID: {$ref: "#/components/headers/JobID"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        default: {$ref: "#/components/responses/Problem"}
  /agent-lab/runs/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listRunEvents
      tags: [traces]
      summary: Page through the events of a run
      x-stability-level: stable
      parameters:
        - {name: after, in: query, description: Return events with an ordinal greater than this., schema: {type: integer, format: int64, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 500}}
      responses:
        "200":
          description: Events in ingest order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunEventPage"}
        default: {$ref: "#/components/responses/Problem"}
  /agent-lab/runs/{id}/export:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: exportRun
      tags: [traces]
      summary: Download a run with all events
      x-stability-level: stable
      responses:
        "200":
          description: JSON attachment.
          headers:
            X-Lab-Job-ID: {$ref: "#/components/headers/JobID"}
          content:
            application/json:
              schema: {type: object}
        default: {$ref: "#/components/responses/Problem"}

  # ------------------------------------------------------------------ otel
  /otel/v1/traces:
    parameters:
      - $ref: "#/components/parameters/Project"
    get:
      operationId: getOtlpInfo
      tags: [otel]
      summary: Describe the OTLP endpoint
      x-stability-level: stable
      responses:
        "200":
          description: Accepted encodings and exporter settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OtlpInfo"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: exportOtlpTraces
      tags: [otel]
      summary: Ingest OTLP/HTTP traces
      description: |
        OTLP/HTTP ExportTraceServiceRequest, protobuf or JSON, optionally gzip
        encoded. Also served at `/v1/traces` so exporters can use the lab root
        as `OTEL_EXPORTER_OTLP_ENDPOINT`. A `503` (listener stopped or storage
        busy) tells standard exporters to retry.
      x-stability-level: stable
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: {type: string, format: binary}
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: ExportTraceServiceResponse in the request encoding.
          content:
            application/x-protobuf:
              schema: {type: string, format: binary}
            application/json:
              schema: {type: object}
        default: {$ref: "#/components/responses/Problem"}

  # ------------------------------------------------------------------ quality
  /agent-lab/runs/{id}/feedback:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listRunFeedback
      tags: [quality]
      summary: List feedback on a run, newest first
      x-stability-level: stable
      responses:
        "200":
          description: Feedback.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Feedback"}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: createRunFeedback
      tags: [quality]
      summary: Add feedback to a run
      x-stability-level: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FeedbackCreate"}
      responses:
        "200":
          description: The stored feedback.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeedbackStored"}
        default: {$ref: "#/components/responses/Problem"}
  /feedback:
    parameters:
      - $ref: "#/components/parameters/Project"
    post:
      operationId: createFeedback
      tags: [quality]
      summary: Add feedback by trace_id or by the agent run_id
      description: Lets the application send feedback later (e.g. a thumbs-up in its UI) using its own run_id.
      x-stability-level: stable
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/FeedbackCreate"
                - type: object
                  properties:
                    trace_id: {type: string}
                    run_id: {type: string}
                    service: {type: string, description: Narrows run_id when several services reuse it.}
      responses:
        "200":
          description: The stored feedback.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeedbackStored"}
        default: {$ref: "#/components/responses/Problem"}
  /feedback/{id}:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deleteFeedback
      tags: [quality]
      summary: Delete feedback
      x-stability-level: stable
      responses:
        "200": {$ref: "#/components/responses/Deleted"}
        default: {$ref: "#/components/responses/Problem"}
  /annotation/queues:
    parameters:
      - $ref: "#/components/parameters/Project"
    get: {operationId: listAnnotationQueues, tags: [quality], summary: List annotation queues, x-stability-level: beta, responses: {"200": {$ref: "#/components/responses/Json"}, default: {$ref: "#/components/responses/Problem"}}}
    post: {operationId: createAnnotationQueue, tags: [quality], summary: Create an annotation queue, x-stability-level: beta, requestBody: {$ref: "#/components/requestBodies/Json"}, responses: {"200": {$ref: "#/components/responses/Json"}, default: {$ref: "#/components/responses/Problem"}}}
  /annotation/queues/{id}:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    get: {operationId: getAnnotationQueue, tags: [quality], summary: Get an annotation queue, x-stability-level: beta, responses: {"200": {$ref: "#/components/responses/Json"}, default: {$ref: "#/components/responses/Problem"}}}
    post: {operationId: updateAnnotationQueue, tags: [quality], summary: Replace an annotation queue, x-stability-level: beta, requestBody: {$ref: "#/components/requestBodies/Json"}, responses: {"200": {$ref: "#/components/responses/Json"}, default: {$ref: "#/components/responses/Problem"}}}
    delete: {operationId: deleteAnnotationQueue, tags: [quality], summary: Delete an annotation queue, x-stability-level: beta, responses: {"200": {$ref: "#/components/responses/Json"}, default: {$ref: "#/components/responses/Problem"}}}
  /annotation/queues/{id}/items:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    get: {operationId: listAnnotationItems, tags: [quality], summary: List queue items, x-stability-level: beta, responses: {"200": {$ref: "#/components/responses/Json"}, default: {$ref: "#/components/responses/Problem"}}}
    post: {operationId: addAnnotationItems, tags: [quality], summary: Add traces to a queue, x-stability-level: beta, requestBody: {$ref: "#/components/requestBodies/Json"}, responses: {"200": {$ref: "#/components/responses/Json"}, default: {$ref: "#/components/responses/Problem"}}}
  /annotation/queues/{id}/next:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    get: {operationId: nextAnnotationItem, tags: [quality], summary: Claim the next item to annotate, x-stability-level: beta, responses: {"200": {$ref: "#/components/responses/Json"}, default: {$ref: "#/components/responses/Problem"}}}
  /annotation/queues/{id}/agreement:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    get: {operationId: getAnnotationAgreement, tags: [quality], summary: Inter-annotator and judge agreement, x-stability-level: beta, responses: {"200": {$ref: "#/components/responses/Json"}, default: {$ref: "#/components/responses/Problem"}}}
  /annotation/items/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    post: {operationId: submitAnnotation, tags: [quality], summary: Submit an annotation, x-stability-level: beta, requestBody: {$ref: "#/components/requestBodies/Json"}, responses: {"200": {$ref: "#/components/responses/Json"}, default: {$ref: "#/components/responses/Problem"}}}
  /annotation/items/{id}/skip:
    parameters:
      - $ref: "#/components/parameters/Project"
      - $ref: "#/components/parameters/Id"
    post: {operationId: skipAnnotation, tags: [quality], summary: Skip an item, x-stability-level: beta, responses: {"200": {$ref: "#/components/responses/Json"}, default: {$ref: "#/components/responses/Problem"}}}
  /evaluators:
    parameters:
      - $ref: "#/components/parameters/Project"
