      type: http
      scheme: bearer
      description: The lab owner token (ARL_AUTH_TOKEN). Not required when the lab runs without one.
    cookie:
      type: apiKey
      in: cookie
      name: arl_token
      description: Set by POST /auth/login; used by the web UI.

  parameters:
    Project:
      name: X-Lab-Project
      in: header
      description: Project to read and write. Defaults to `default`.
      schema: {type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$", default: default}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Repeating a request with the same key returns or updates the same resource instead of creating another.
      schema: {type: string, maxLength: 200}
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
    Name:
      name: name
      in: path
      required: true
      schema: {type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,99}$"}

  headers:
    JobID:
      description: Durable job created for this request; poll GET /jobs/{id}.
      schema: {type: string}
    RequestID:
      description: Request identifier, echoed from the request or generated. Quote it in bug reports.
      schema: {type: string}

  requestBodies:
    Json:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    OptionalJson:
      required: false
      content:
        application/json:
          schema: {type: object, additionalProperties: true}

  responses:
    Problem:
      description: Error, as an RFC 9457 problem document.
      headers:
        X-Request-ID: {$ref: "#/components/headers/RequestID"}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Json:
      description: Success. The body of beta operations is a JSON value whose shape may still change.
      content:
        application/json:
          schema: {}
    Ok:
      description: Success.
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: {type: boolean, const: true}
    Deleted:
      description: The resource was deleted.
      content:
        application/json:
          schema:
            type: object
            required: [deleted]
            properties:
              deleted: {type: string, description: ID of the deleted resource.}

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. Unknown members must be ignored.
      required: [type, title, status, detail, code]
      properties:
        type: {type: string, description: "`urn:arl:problem:<code>`."}
        title: {type: string, description: HTTP reason phrase.}
        status: {type: integer}
        detail: {type: string, description: Human-readable explanation. Do not parse it.}
        code:
          type: string
          description: |
            Stable machine-readable code. Current values: bad_request,
            unauthenticated, forbidden, not_found, feature_disabled,
            method_not_allowed, conflict, payload_too_large,
            validation_failed, rate_limited, internal, unavailable,
            job_pending. New codes may be added; treat unknown codes by their
            HTTP status.
        request_id: {type: string}
        feature: {type: string, description: Disabled module, with code feature_disabled.}
        errors:
          type: array
          description: Per-record validation errors, with code validation_failed.
          items: {}

    Health:
      type: object
      required: [status, version, uptime_s, auth_required, mode, async_transport, features]
      properties:
        status: {type: string, const: ok}
        version: {type: string}
        uptime_s: {type: number}
        active_campaigns: {type: integer}
        auth_required: {type: boolean}
        mode: {type: string, description: "`all` (one process) or `sync` (split AWS gateway)."}
        async_transport: {type: string, enum: [local-worker, sqs]}
        features:
          type: array
          items: {type: string}
    Features:
      type: object
      required: [enabled, modules, presets, build, env]
      properties:
        enabled:
          type: array
          items: {type: string}
        modules:
          type: array
          items: {$ref: "#/components/schemas/Module"}
        presets:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        build:
          type: object
          properties:
            otel: {type: boolean}
            sqs: {type: boolean}
            ui: {type: boolean}
            grpc: {type: boolean}
        env: {type: string}
    Module:
      type: object
      required: [name, title, requires, compiled, enabled]
      properties:
        name: {type: string}
        title: {type: string}
        requires:
          type: array
          items: {type: string}
        compiled: {type: boolean}
        build_tag: {type: string}
        enabled: {type: boolean}
    AuthStatus:
      type: object
      required: [auth_required, authenticated]
      properties:
        auth_required: {type: boolean}
        authenticated: {type: boolean}
    Project:
      type: object
      required: [id, name, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        created_at: {$ref: "#/components/schemas/UnixTime"}
    ProjectCreate:
      type: object
      required: [id, name]
      properties:
        id: {type: string, pattern: "^[a-z][a-z0-9_-]{0,63}$"}
        name: {type: string, minLength: 1, maxLength: 200}
    Job:
      type: object
      required: [id, kind, state, attempts, created_at, updated_at]
      properties:
        id: {type: string}
        kind: {type: string}
        state: {type: string, enum: [queued, running, done, failed]}
        attempts: {type: integer}
        error: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UnixTime:
      type: number
      description: Unix time in seconds, with fractions.

    ListenerStatus:
      type: object
      required: [listening, always_on, active_connections, peers, protocol, ws_path]
      properties:
        listening: {type: boolean}
        always_on: {type: boolean}
        active_connections: {type: integer}
        peers:
          type: array
          items:
            type: object
            properties:
              session_id: {type: string}
              service: {type: string}
              capabilities:
                type: [array, "null"]
                items: {type: string}
              replay: {type: boolean}
              connected_at: {$ref: "#/components/schemas/UnixTime"}
        protocol: {type: string, const: arl/1}
        ws_path: {type: string}
        config: {type: object}
    Session:
      type: object
      required: [id, service, config, created_at, last_seen, connected]
      properties:
        id: {type: string}
        service: {type: string}
        config: {type: object, description: "Handshake profile: lab, phases, capabilities, metadata."}
        created_at: {$ref: "#/components/schemas/UnixTime"}
        last_seen: {$ref: "#/components/schemas/UnixTime"}
        connected: {type: boolean}
    RunSummary:
      type: object
      required: [id, session_id, external_id, name, status, started_at, event_count, service, cost_usd, tokens_in, tokens_out, model_calls, tool_calls, errors, models, tags, source, feedback_count]
      properties:
        id: {type: string, description: Lab-assigned trace ID.}
        session_id: {type: string}
        external_id: {type: string, description: The run_id the agent sent.}
        name: {type: string}
        status: {type: string, description: "running, completed, failed or cancelled."}
        started_at: {$ref: "#/components/schemas/UnixTime"}
        finished_at: {type: [number, "null"]}
        event_count: {type: integer}
        service: {type: string}
        lab: {type: [string, "null"]}
        duration_ms: {type: [number, "null"]}
        cost_usd: {type: number}
        tokens_in: {type: integer}
        tokens_out: {type: integer}
        model_calls: {type: integer}
        tool_calls: {type: integer}
        errors: {type: integer}
        models:
          type: array
          items: {type: string}
        tags:
          type: array
          items: {type: string}
        thread_id: {type: [string, "null"]}
        user_id: {type: [string, "null"]}
        source: {type: string}
        verdict: {type: [string, "null"]}
        feedback_count: {type: integer}
    Run:
      type: object
      required: [id, session_id, external_id, name, status, started_at, event_count, service, source]
      properties:
        id: {type: string}
        session_id: {type: string}
        external_id: {type: string}
        name: {type: string}
        status: {type: string}
        check_config: {type: object}
        started_at: {$ref: "#/components/schemas/UnixTime"}
        finished_at: {type: [number, "null"]}
        event_count: {type: integer}
        service: {type: string}
        config: {type: object}
        lab: {type: [string, "null"]}
        thread_id: {type: [string, "null"]}
        user_id: {type: [string, "null"]}
        tags:
          type: [array, "null"]
          items: {type: string}
        source: {type: string}
        summary: {type: [object, "null"], description: "Derived analysis: phases, graph, costs, check verdicts."}
    RunEvent:
      type: object
      description: A stored arl/1 event envelope (see AgentEvent) plus its ingest position.
      required: [ordinal, received_at, event_id, run_id, event, phase]
      properties:
        ordinal: {type: integer, format: int64}
        received_at: {$ref: "#/components/schemas/UnixTime"}
        type: {type: string, const: event}
        event_id: {type: string}
        run_id: {type: string}
        event: {type: string}
        phase: {type: string}
        span_id: {type: [string, "null"]}
        parent_span_id: {type: [string, "null"]}
        timestamp: {type: [number, "null"]}
        data: {type: object}
    RunEventPage:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RunEvent"}
        has_more: {type: boolean}
    OtlpInfo:
      type: object
      required: [endpoint, encodings, listening]
      properties:
        endpoint: {type: string}
        encodings:
          type: array
          items: {type: string}
        compression:
          type: array
          items: {type: string}
        conventions:
          type: array
          items: {type: string}
        example_env: {type: object, additionalProperties: {type: string}}
        listening: {type: boolean}
        generated_at: {$ref: "#/components/schemas/UnixTime"}

    FeedbackCreate:
      type: object
      required: [name]
      description: At least one of value, label or comment is required.
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        value: {type: [number, boolean, "null"], description: Booleans are stored as 1 or 0.}
        label: {type: [string, "null"], maxLength: 200}
        comment: {type: [string, "null"], maxLength: 5000}
        source: {type: string, enum: [user, human, sdk], default: user}
        author: {type: string, maxLength: 100}
        metadata: {type: object, description: At most 16 KiB.}
    FeedbackStored:
      type: object
      required: [id, trace_id, name, source, author]
      properties:
        id: {type: string}
        trace_id: {type: string}
        name: {type: string}
        value: {type: [number, "null"]}
        label: {type: [string, "null"]}
        comment: {type: [string, "null"]}
        source: {type: string, enum: [user, human, sdk, auto]}
        author: {type: string}
        metadata: {type: object}
    Feedback:
      allOf:
        - $ref: "#/components/schemas/FeedbackStored"
        - type: object
          required: [created_at]
          properties:
            queue_id: {type: [string, "null"]}
            evaluator_id: {type: [string, "null"]}
            created_at: {$ref: "#/components/schemas/UnixTime"}

    PromptMessage:
      type: object
      required: [role, content]
      properties:
        role: {type: string, enum: [system, user, assistant]}
        content: {type: string}
    PromptTemplate:
      type: object
      properties:
        system: {type: string}
        messages:
          type: array
          items: {$ref: "#/components/schemas/PromptMessage"}
    Prompt:
      type: object
      required: [id, name, latest, labels]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        latest: {type: integer, description: Newest version number.}
        labels:
          type: object
          description: Label to version number.
          additionalProperties: {type: integer}
        created_at: {$ref: "#/components/schemas/UnixTime"}
        updated_at: {$ref: "#/components/schemas/UnixTime"}
    PromptCommit:
      type: object
      required: [template]
      properties:
        template: {$ref: "#/components/schemas/PromptTemplate"}
        config: {type: object, description: Model parameters (model, temperature, ...).}
        message: {type: string, description: Commit message.}
        author: {type: string}
        labels:
          type: array
          description: Labels to move to the new version.
          items: {type: string}
    PromptVersion:
      type: object
      required: [id, prompt, version, template, variables, digest, created_at]
      properties:
        id: {type: string, description: "`<name>@<version>`."}
        prompt: {type: string}
        version: {type: integer}
        template: {$ref: "#/components/schemas/PromptTemplate"}
        config: {type: [object, "null"]}
        variables:
          type: array
          items: {type: string}
        message: {type: string}
        author: {type: string}
        digest: {type: string}
        created_at: {$ref: "#/components/schemas/UnixTime"}
    PromptCommitted:
      allOf:
        - $ref: "#/components/schemas/PromptVersion"
        - type: object
          required: [created]
          properties:
            created: {type: boolean, description: False when identical to the latest version.}
    PromptResolved:
      allOf:
        - $ref: "#/components/schemas/PromptVersion"
        - type: object
          required: [labels, latest]
          properties:
            labels:
              type: object
              additionalProperties: {type: integer}
            description: {type: string}
            latest: {type: integer}
    PromptRendered:
      type: object
      required: [name, version, messages, missing]
      properties:
        name: {type: string}
        version: {type: integer}
        system: {type: string}
        messages:
          type: array
          items: {$ref: "#/components/schemas/PromptMessage"}
        config: {type: [object, "null"]}
        missing:
          type: array
          description: Variables the template uses but the request did not supply.
          items: {type: string}

    # arl/1 frames, referenced by asyncapi.yaml.
    AgentHello:
      type: object
      additionalProperties: false
      required: [type, protocol, service, stage]
      properties:
        type: {const: hello}
        protocol: {const: arl/1}
        service: {type: string, minLength: 1, maxLength: 200}
        stage: {const: dev}
        lab: {type: string, enum: [agent, router, generic], default: agent}
        phases:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 80}
        capabilities:
          type: array
          items: {type: string}
        metadata: {type: object}
        project_id: {type: string}
        session_id: {type: string, description: Resume this session; requires resume_token.}
        resume_token: {type: string}
    AgentEvent:
      type: object
      additionalProperties: false
      required: [type, event_id, run_id, event]
      properties:
        type: {const: event}
        event_id: {type: string, minLength: 1, maxLength: 128, description: Unique per session; resending the same payload is deduplicated.}
        run_id: {type: string, minLength: 1, maxLength: 128}
        event: {type: string, maxLength: 100, description: "e.g. run.start, model.request, tool.call, cost.record, run.end."}
        phase: {type: string, maxLength: 80, default: agent}
        span_id: {type: [string, "null"], maxLength: 128}
        parent_span_id: {type: [string, "null"], maxLength: 128}
        timestamp: {type: [number, "null"], description: Client Unix time in seconds.}
        data: {type: object}
    AgentPing:
      type: object
      required: [type]
      properties:
        type: {const: ping}
    AgentReplayStatus:
      type: object
      required: [type, replay_id, status]
      properties:
        type: {const: replay.status}
        replay_id: {type: string}
        status: {type: string, enum: [started, completed, failed, rejected]}
        error: {type: string, maxLength: 2000}
    LabHelloAck:
      type: object
      required: [type, protocol, session_id, lab, phases, max_message_bytes, max_events_per_run, max_trace_bytes, heartbeat_seconds, features]
      properties:
        type: {const: hello_ack}
        protocol: {const: arl/1}
        session_id: {type: string}
        resume_token: {type: string, description: Returned once when the session is created. Keep it private.}
        lab: {type: string}
        phases:
          type: array
          items: {type: string}
        max_message_bytes: {type: integer}
        max_events_per_run: {type: integer}
        max_trace_bytes: {type: integer}
        heartbeat_seconds: {type: integer}
        features:
          type: array
          items: {type: string}
    LabAck:
      type: object
      required: [type]
      properties:
        type: {const: ack}
        event_id: {type: string}
        run_id: {type: string}
        trace_id: {type: string}
        ordinal: {type: integer, format: int64}
        duplicate: {type: boolean}
        replay_id: {type: string, description: Set when acknowledging replay.status.}
    LabPong:
      type: object
      required: [type, timestamp, listening]
      properties:
        type: {const: pong}
        timestamp: {$ref: "#/components/schemas/UnixTime"}
        listening: {type: boolean}
    LabError:
      type: object
      required: [type, code, message]
      properties:
        type: {const: error}
        code: {type: string, description: "e.g. validation_error, not_listening, event_conflict, message_too_large, invalid_resume."}
        message: {type: string}
        event_id: {type: [string, "null"]}
    LabReplay:
      type: object
      required: [type, replay_id, scenario_id]
      properties:
        type: {const: replay}
        replay_id: {type: string}
        scenario_id: {type: string}
        source_trace_id: {type: [string, "null"]}
        name: {type: [string, "null"]}
        input: {description: The input to run the agent with.}
        state: {type: object, description: Saved functional state to restore before running.}
        config: {type: object, description: Overrides such as model or prompt.}
        checks: {type: object}
