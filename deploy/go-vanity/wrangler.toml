# Go vanity import paths: https://go.vicoworks.com/arl → github.com/VicoAritonang/lab-of-night-and-flame (sdk/go)
name = "go-vicoworks"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# vicoworks.com must be a zone in the same Cloudflare account. Wrangler creates
# the DNS record and certificate for the custom domain on deploy; delete any
# existing DNS record for go.vicoworks.com first.
routes = [
  { pattern = "go.vicoworks.com", custom_domain = true }
]

[vars]
HOST = "go.vicoworks.com"

[observability]
enabled = true
